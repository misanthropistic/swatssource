<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Christmas">
  <defs>
    <radialGradient id="christmas-bauble" cx="36%" cy="26%" r="78%">
      <stop offset="0%" stop-color="#fecaca" />
      <stop offset="46%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </radialGradient>
  </defs>
  <!-- The hook and cap that make a circle read as a bauble. -->
  <path d="M32 3v6" stroke="#d4d4d8" stroke-width="3" stroke-linecap="round" />
  <rect x="25" y="9" width="14" height="8" rx="3" fill="#a1a1aa" />
  <rect x="25" y="9" width="14" height="3" rx="1.5" fill="#d4d4d8" />
  <circle cx="32" cy="38" r="21" fill="url(#christmas-bauble)" />
  <!-- The curved highlight, then a snowflake on the glass. -->
  <path d="M16 30c1.5-8 9-13 15-13" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.45" />
  <path d="M32 29v18M23 38h18M25.6 31.6l12.8 12.8M38.4 31.6 25.6 44.4" stroke="#fee2e2" stroke-width="2" stroke-linecap="round" opacity="0.85" />
