<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#FF2693" />
        
        <!-- Primary Meta Tags -->
        <title>swats | Home</title>
        <meta name="title" content="swats.bio | claim your digital identity" />
        <meta name="description" content="swats.bio - claim your digital identity with customizable bios, music player, social links, and custom themes." />

        <!-- Favicon. Regenerated from the current logo, at the sizes browsers
             actually ask for, rather than making them downscale one large file.
             The ?v= is deliberate: browsers cache a favicon far harder than the
             rest of the page, so without a new URL they keep drawing the old
             mark long after the files change. -->
        <link rel="icon" href="%PUBLIC_URL%/favicon.ico?v=4" sizes="any" />
        <link rel="icon" type="image/png" sizes="16x16" href="%PUBLIC_URL%/favicon-16.png?v=4" />
        <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/favicon-32.png?v=4" />
        <link rel="icon" type="image/png" sizes="512x512" href="%PUBLIC_URL%/favicon.png?v=4" />
        <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/favicon-180.png?v=4" />

        <!-- Open Graph / Facebook / Discord Embed -->
        <meta property="og:type" content="website" />
        <meta property="og:url" content="https://swats.bio/" />
        <meta property="og:site_name" content="swats.bio" />
        <meta property="og:title" content="swats.bio | claim your digital identity" />
        <meta property="og:description" content="The premier link in bio platform for creators, gamers, and communities." />
        <meta property="og:image" content="%PUBLIC_URL%/logo.png" />

        <!-- Twitter Embed -->
        <meta property="twitter:card" content="summary_large_image" />
        <meta property="twitter:url" content="https://swats.bio/" />
        <meta property="twitter:title" content="swats.bio | claim your digital identity" />
        <meta property="twitter:description" content="The premier link in bio platform for creators, gamers, and communities." />
        <meta property="twitter:image" content="%PUBLIC_URL%/logo.png" />

        <!-- Google Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Unbounded:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />

        <!-- The global error handler that used to live here moved into
             src/index.js so the served Content-Security-Policy can be
             script-src 'self' with no inline exception. See SECURITY.md. -->
    </head>
    <body class="bg-black text-white antialiased selection:bg-purple-500/30 selection:text-purple-300">
        <noscript>You need to enable JavaScript to run swats.bio.</noscript>
        <div id="root"></div>
    </body>
</html>
