<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>effects</title>
<style>
:root{--bg:#f2f2f7;--fg:#15151f;--card:#fff;--mu:#667;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b0b12;--fg:#eee;--card:#151522;--mu:#99a}}
:root[data-theme=dark]{--bg:#0b0b12;--fg:#eee;--card:#151522;--mu:#99a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif;padding:16px}
h1{margin:0 0 4px;font-size:24px}p{margin:0 0 12px;color:var(--mu)}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}nav button,input{font:inherit;border-radius:20px;border:1px solid #8884;background:var(--card);color:var(--fg);padding:7px 14px}
nav button.on{background:#7c5cff;color:#fff;border-color:#7c5cff}input{width:200px}
#G{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.tile{background:var(--card);border-radius:14px;overflow:hidden;position:relative}.tile label{display:block;padding:8px 12px;font-size:12px;color:var(--mu)}
.tile canvas{display:block;width:100%;background:#0b0b12;touch-action:none}.av canvas{width:180px;margin:auto}
.scene canvas{position:absolute;left:0;top:0;height:calc(100% - 31px);background:none;pointer-events:none}.scene .bgs{height:calc(100% - 31px);position:absolute;inset:0 0 auto}
.scene{min-height:222px}.scene .bgs{background:linear-gradient(160deg,#ff9a6b,#7b3fa0 60%,#1b1f4a);display:grid;place-items:center;font:800 40px system-ui;color:#fff}
.stage{height:130px;background:#0b0b12;display:grid;place-items:center;overflow:hidden;perspective:400px}
.s{font:800 44px/1.1 system-ui,sans-serif;color:#fff;display:inline-block;position:relative;white-space:nowrap}.s i{display:inline-block;font-style:normal;white-space:pre}
.cur::after{content:"|";animation:bl .6s steps(1) infinite}@keyframes bl{50%{opacity:0}}
.shake i{animation:sh .35s infinite;animation-delay:calc(var(--i)*-.07s)}@keyframes sh{0%,100%{transform:none}25%{transform:translate(-2px,2px) rotate(-6deg)}50%{transform:translate(2px,-2px) rotate(5deg)}75%{transform:translate(-1px,-2px) rotate(-3deg)}}
.rainbow,.neon-aurora{-webkit-background-clip:text;background-clip:text;color:transparent;background-size:200%;animation:bp 2s linear infinite;background-image:linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}@keyframes bp{to{background-position:200% 0}}
.neon-aurora{background-image:linear-gradient(90deg,#0ff,#0f8,#a0f,#f0a,#0ff);background-size:300%;animation-duration:4s;filter:drop-shadow(0 0 8px #0fa) drop-shadow(0 0 18px #a0f)}
.shine{background:linear-gradient(100deg,#777 40%,#fff 50%,#777 60%) 0/250%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shn 2s linear infinite}@keyframes shn{from{background-position:150% 0}to{background-position:-50% 0}}
.glow{animation:gl 1.6s ease-in-out infinite alternate}@keyframes gl{from{text-shadow:0 0 4px #fff,0 0 10px #7df}to{text-shadow:0 0 10px #fff,0 0 24px #7df,0 0 48px #38f,0 0 80px #38f}}
.glitch::before,.glitch::after{content:attr(data-t);position:absolute;left:0;top:0;width:100%;mix-blend-mode:screen}.glitch::before{color:#0ff;animation:g1 1.2s infinite steps(1)}.glitch::after{color:#f0f;animation:g2 .9s infinite steps(1)}
@keyframes g1{0%,100%{clip-path:inset(0 0 60% 0);transform:translate(-3px)}20%{clip-path:inset(30% 0 30% 0);transform:translate(3px)}40%{clip-path:inset(70% 0 5% 0);transform:translate(-2px)}60%{clip-path:inset(10% 0 80% 0);transform:translate(4px)}80%{clip-path:inset(50% 0 20% 0);transform:translate(-4px)}}
@keyframes g2{0%,100%{clip-path:inset(60% 0 0 0);transform:translate(3px)}25%{clip-path:inset(5% 0 70% 0);transform:translate(-3px)}50%{clip-path:inset(40% 0 40% 0);transform:translate(4px)}75%{clip-path:inset(80% 0 5% 0);transform:translate(-2px)}}
.flames{animation:fl .25s infinite alternate}@keyframes fl{from{text-shadow:0 0 4px #fff,0 -4px 8px #ff0,0 -10px 14px #f90,0 -18px 22px #f40,0 -28px 30px #c00}to{text-shadow:0 0 4px #fff,2px -6px 10px #ff0,-2px -14px 16px #f90,2px -22px 26px #f40,0 -36px 36px #900}}
.flicker{animation:fk 2.5s infinite}@keyframes fk{0%,19%,21%,23%,25%,54%,56%,100%{opacity:1;text-shadow:0 0 8px #fff,0 0 22px #f0f}20%,24%,55%{opacity:.15;text-shadow:none}}
.flip i{animation:fp 2.4s infinite;animation-delay:calc(var(--i)*.12s)}@keyframes fp{0%,50%,100%{transform:rotateX(0)}25%{transform:rotateX(360deg)}}
.loading i{animation:ld 1.2s infinite;animation-delay:calc(var(--i)*.15s)}@keyframes ld{0%,100%{opacity:.2;transform:none}50%{opacity:1;transform:translateY(-8px)}}
.blackout i{animation:bo 3s infinite;animation-delay:calc(var(--i)*.2s)}@keyframes bo{0%,40%,100%{color:#fff;text-shadow:0 0 8px #fff}60%,80%{color:#000;text-shadow:0 0 1px #555}}
.bleeding{color:#e11;text-shadow:0 2px 0 #800,0 0 8px #f00}.bleeding i{position:relative}.bleeding i::after{content:"";position:absolute;left:35%;top:82%;width:5px;height:0;border-radius:0 0 5px 5px;background:linear-gradient(#d00,#600);animation:dr 3s infinite;animation-delay:calc(var(--i)*-.6s)}@keyframes dr{0%{height:0}70%{height:30px;opacity:1}100%{height:36px;opacity:0}}
.shimmer-in i{animation:si 3.4s infinite;animation-delay:calc(var(--i)*.12s)}@keyframes si{0%{opacity:0;filter:blur(8px) brightness(3)}25%,88%{opacity:1;filter:none}100%{opacity:0}}
.shimmer-out i{animation:so 3.4s infinite;animation-delay:calc(var(--i)*.12s)}@keyframes so{0%,40%{opacity:1;filter:none}65%{opacity:0;filter:blur(8px) brightness(3)}100%{opacity:0}}
.morph.m{animation:mo .9s}@keyframes mo{0%,100%{filter:blur(0);opacity:1}50%{filter:blur(14px) contrast(8);opacity:.3}}
.sp{position:absolute;width:14px;height:14px;pointer-events:none;clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);animation:spk .9s forwards}@keyframes spk{from{transform:scale(0) rotate(0)}50%{transform:scale(1.3) rotate(90deg)}to{transform:scale(0) rotate(180deg)}}
.white-sparkle,.green-sparkle,.rainbow-sparkle{text-shadow:0 0 10px #fff6}.green-sparkle{color:#9fb}.rainbow-sparkle{color:#fdf}
</style></head><body>
<h1>swats FX harness</h1><p id="cnt"></p>
<nav id="N"></nav><input id="I" value="swats" placeholder="your text" maxlength="14"><div id="G" style="margin-top:12px"></div>
<script>
const TAU=Math.PI*2,R=Math.random,S=Math.sin,C=Math.cos,mk=(t,c,p)=>{const e=document.createElement(t);if(c)e.className=c;p&&p.append(e);return e};
let text='swats',clean=[],items=[];
const letters=(el,t)=>el.innerHTML=[...t].map((c,i)=>`<i style="--i:${i}">${c}</i>`).join('');
const spark=f=>el=>{const iv=setInterval(()=>{const b=mk('b','sp',el);b.style.cssText=`left:${R()*100}%;top:${R()*100}%;background:${f()}`;setTimeout(()=>b.remove(),900)},90);return()=>clearInterval(iv)};
const TX={
typewriter:(el,t)=>{let n=0,d=1;el.classList.add('cur');const iv=setInterval(()=>{n+=d;if(n>t.length+6)d=-1;if(n<0)d=1;el.textContent=t.slice(0,Math.max(0,Math.min(n,t.length)))},140);return()=>clearInterval(iv)},
scramble:(el,t)=>{let f=0;const iv=setInterval(()=>{f++;const p=(f%70)/40;el.textContent=[...t].map((c,i)=>i<p*t.length?c:'!<>-_/[]{}=+*^?#'[R()*17|0]).join('')},50);return()=>clearInterval(iv)},
morph:(el,t)=>{const w=[t,'effects','fx','✦'];let n=0;const iv=setInterval(()=>{el.classList.remove('m');void el.offsetWidth;el.classList.add('m');setTimeout(()=>el.textContent=w[++n%4],450)},2200);return()=>clearInterval(iv)},
'white-sparkle':spark(()=>'#fff'),'green-sparkle':spark(()=>`hsl(${120+R()*40},100%,${60+R()*25}%)`),'rainbow-sparkle':spark(()=>`hsl(${R()*360},100%,70%)`),
reactive:(el,t,st)=>{const f=e=>el.querySelectorAll('i').forEach(i=>{const r=i.getBoundingClientRect(),d=Math.hypot(e.clientX-r.x-r.width/2,e.clientY-r.y-r.height/2),k=Math.max(0,1-d/110);i.style.transform=`scale(${1+k*.8}) translateY(${-k*10}px)`;i.style.color=`hsl(${k*300},${k*100}%,${100-k*40}%)`});st.addEventListener('pointermove',f);return()=>st.removeEventListener('pointermove',f)}};
const LET=new Set('shake flip loading blackout bleeding shimmer-in shimmer-out reactive'.split(' '));
const TXT='typewriter shake rainbow white-sparkle morph shimmer-in shimmer-out shine glow glitch flames scramble flicker flip loading green-sparkle rainbow-sparkle blackout bleeding neon-aurora reactive'.split(' ');
/* canvas helpers */
const rain=bg=>(c,w,h,t,s)=>{s.d||=Array.from({length:110},()=>[R()*w,R()*h,3+R()*5]);if(bg){c.fillStyle='#0d1a2b';c.fillRect(0,0,w,h)}c.strokeStyle='#9cf8';s.d.forEach(d=>{c.beginPath();c.moveTo(d[0],d[1]);c.lineTo(d[0]-2,d[1]+d[2]*2.5);c.stroke();d[1]+=d[2]*2;d[0]-=1;if(d[1]>h){d[1]=-20;d[0]=R()*w}})};
const snow=(bg,L)=>(c,w,h,t,s)=>{s.f||=Array.from({length:L?100:70},()=>({x:R()*w,y:R()*h,z:L?R():.5,p:R()*9}));if(bg){const g=c.createLinearGradient(0,0,0,h);g.addColorStop(0,L?'#08101e':'#1b2a44');g.addColorStop(1,L?'#274068':'#2d4366');c.fillStyle=g;c.fillRect(0,0,w,h)}
s.f.forEach(f=>{f.y+=.3+f.z*1.6;f.x+=S(t+f.p)*.5*(.5+f.z)+(L?C(t*.4):0);if(f.y>h){f.y=-5;f.x=R()*w}c.globalAlpha=L?.3+f.z*.7:.9;c.fillStyle='#fff';if(L){c.shadowColor='#fff';c.shadowBlur=(1-f.z)*8}c.beginPath();c.arc(f.x,f.y,1+f.z*(L?3.5:2),0,TAU);c.fill()});c.globalAlpha=1;c.shadowBlur=0};
const fall=(bg,mkp,dr)=>(c,w,h,t,s)=>{s.q||=Array.from({length:40},()=>({x:R()*w,y:R()*h,v:.6+R()*1.2,a:R()*TAU,r:R()*TAU}));c.fillStyle=bg;c.fillRect(0,0,w,h);s.q.forEach(p=>{p.y+=p.v;p.a+=.04;p.x+=S(p.a)*.8;p.r+=.05;if(p.y>h+20){p.y=-20;p.x=R()*w}c.save();c.translate(p.x,p.y);c.rotate(p.r);dr(c,p);c.restore()})};
const spot=(m,w,h,c,r)=>{const g=c.createRadialGradient(m.x,m.y,8,m.x,m.y,r);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.93)');c.fillStyle=g;c.fillRect(0,0,w,h)};
const BG={rain:rain(1),'snow-v1':snow(1,0),'snow-v2':snow(1,1),
thunder:(c,w,h,t,s)=>{c.fillStyle='#10121c';c.fillRect(0,0,w,h);for(let i=0;i<7;i++){c.fillStyle='#1d2238';c.beginPath();c.arc((i*60+t*8)%(w+80)-40,20+S(i)*14,45,0,TAU);c.fill()}
if(!s.b&&R()<.015){s.b=[];let x=w*(.2+R()*.6),y=30;while(y<h){s.b.push([x,y]);x+=(R()-.5)*30;y+=10+R()*14}s.n=1}
if(s.b){c.fillStyle=`rgba(200,210,255,${s.n*.35})`;c.fillRect(0,0,w,h);c.strokeStyle=`rgba(255,255,255,${s.n})`;c.lineWidth=2;c.shadowColor='#8af';c.shadowBlur=12;c.beginPath();s.b.forEach((p,i)=>i?c.lineTo(...p):c.moveTo(...p));c.stroke();c.shadowBlur=0;s.n-=.04;if(s.n<=0)s.b=0}},
cherry:fall('#2a1424',0,(c,p)=>{c.fillStyle='#ffb7d0';c.beginPath();c.ellipse(0,0,6,3.5,0,0,TAU);c.fill();c.fillStyle='#ff7fae';c.fillRect(-1,-1,4,2)}),
cash:fall('#0c1a12',0,(c,p)=>{c.fillStyle='#3fae5a';c.fillRect(-14,-7,28,14);c.strokeStyle='#cfe';c.strokeRect(-12,-5,24,10);c.fillStyle='#cfe';c.font='bold 9px sans-serif';c.fillText('$',-3,3)}),
galaxy:(c,w,h,t,s)=>{s.s||=Array.from({length:600},()=>({r:R()**1.5*h*.85,j:R()-.5,arm:(R()*3|0)*TAU/3,k:R()}));c.fillStyle='#05030f';c.fillRect(0,0,w,h);s.s.forEach(p=>{const a=p.arm+p.r*.035+t*(.35-p.r/h*.25);c.fillStyle=`hsl(${210+p.r/h*130},90%,${55+p.k*35}%)`;c.fillRect(w/2+C(a)*p.r*1.4+p.j*14,h/2+S(a)*p.r*.55+p.j*8,1.6,1.6)});const g=c.createRadialGradient(w/2,h/2,0,w/2,h/2,40);g.addColorStop(0,'#fff9');g.addColorStop(1,'#0000');c.fillStyle=g;c.fillRect(0,0,w,h)},
vhs:(c,w,h,t)=>{c.fillStyle='#16162a';c.fillRect(0,0,w,h);['#ddd','#dd3','#3dd','#3d3','#d3d','#d33','#33d'].forEach((k,i)=>{c.fillStyle=k;c.fillRect(i*w/7,0,w/7,50)});c.font='bold 30px monospace';c.fillStyle='#f00a';c.fillText('PLAY ▶',22+2,120);c.fillStyle='#0ffa';c.fillText('PLAY ▶',18,118);c.fillStyle='#fff';c.fillText('PLAY ▶',20,119);
const y=(t*70)%(h+40)-20;c.drawImage(c.canvas,0,y,w,14,R()*14-4,y,w,14);for(let i=0;i<25;i++){c.fillStyle=`rgba(255,255,255,${R()*.15})`;c.fillRect(R()*w,R()*h,20+R()*60,1)}c.fillStyle='#0003';for(let i=0;i<h;i+=3)c.fillRect(0,i,w,1)},
spotlight:(c,w,h,t,s,m)=>{c.fillStyle='#e8e0ff';c.fillRect(0,0,w,h);c.fillStyle='#403070';c.font='800 44px system-ui';c.fillText('swats',w/2-70,h/2+15);spot(m,w,h,c,80)}};
const OV={noise:(c,w,h)=>{for(let i=0;i<900;i++){c.fillStyle=`rgba(${R()<.5?255:0},${R()<.5?255:0},255,${R()*.25})`;c.fillRect(R()*w,R()*h,1.5,1.5)}},
retro:(c,w,h,t)=>{c.fillStyle='#0004';for(let i=0;i<h;i+=3)c.fillRect(0,i,w,1);const g=c.createRadialGradient(w/2,h/2,h*.3,w/2,h/2,h*.9);g.addColorStop(0,'#0000');g.addColorStop(1,'#000c');c.fillStyle=g;c.fillRect(0,0,w,h);c.fillStyle='#fff1';c.fillRect(0,(t*50)%h,w,20);c.fillStyle=`rgba(0,255,120,${.05+.04*S(t*40)})`;c.fillRect(0,0,w,h)},
stars:(c,w,h,t,s)=>{s.s||=Array.from({length:50},()=>[R()*w,R()*h,R()*6]);s.s.forEach(p=>{const a=.5+.5*S(t*2+p[2]);c.fillStyle=`rgba(255,255,255,${a})`;c.fillRect(p[0]-5*a,p[1],10*a,1);c.fillRect(p[0],p[1]-5*a,1,10*a)})},
snow:snow(0,0),dots:(c,w,h,t)=>{for(let x=6;x<w;x+=12)for(let y=6;y<h;y+=12){c.fillStyle='#ffffff55';c.beginPath();c.arc(x,y,3+2.5*S(x*.04+y*.04+t*2),0,TAU);c.fill()}},rain:rain(0)};
/* avatar */
const X=90,Y=90,ring=(c,col,w,r=60)=>{c.strokeStyle=col;c.lineWidth=w;c.beginPath();c.arc(X,Y,r,0,TAU);c.stroke()},arc=(c,a,l,col,w,r=60)=>{c.strokeStyle=col;c.lineWidth=w;c.lineCap='round';c.beginPath();c.arc(X,Y,r,a,a+l);c.stroke()};
const st4=(c,x,y,s,col)=>{c.fillStyle=col;c.beginPath();c.moveTo(x,y-s);c.quadraticCurveTo(x,y,x+s,y);c.quadraticCurveTo(x,y,x,y+s);c.quadraticCurveTo(x,y,x-s,y);c.quadraticCurveTo(x,y,x,y-s);c.fill()};
const cg=(c,t,ks)=>{const g=c.createConicGradient(t,X,Y);ks.forEach((k,i)=>g.addColorStop(i/(ks.length-1),k));return g};
const AV={shine:(c,t)=>{ring(c,'#667',6);arc(c,t*3,1,'#fff',6)},grain:c=>{for(let i=0;i<280;i++){const a=R()*TAU,r=54+R()*14;c.fillStyle=`rgba(255,255,255,${R()})`;c.fillRect(X+C(a)*r,Y+S(a)*r,1.5,1.5)}},
blur:(c,t)=>{c.shadowColor='#4df';c.shadowBlur=14+10*S(t*3);ring(c,'#4df',5);c.shadowBlur=0},blink:(c,t)=>{if(S(t*5)>0){c.shadowColor='#fe4';c.shadowBlur=14;ring(c,'#fe4',6);c.shadowBlur=0}else ring(c,'#432',6)},
shimmer:(c,t)=>ring(c,cg(c,t*2,['#fff','#8ad','#238','#fff']),7),pulse:(c,t)=>{for(let i=0;i<3;i++){const p=(t*.7+i/3)%1;c.globalAlpha=1-p;ring(c,'#f6c',3,52+p*30)}c.globalAlpha=1},
glaze:(c,t)=>{const g=c.createLinearGradient(30,30,150,150);g.addColorStop(0,'#fff');g.addColorStop(.5,'#9bd');g.addColorStop(1,'#356');ring(c,g,8);arc(c,-2.3+S(t*2)*.5,.7,'#fffd',3,57)},
chromatic:(c,t)=>{c.globalCompositeOperation='lighter';const o=3+3*S(t*2);[['#f00',-o],['#0f0',0],['#00f',o]].forEach(([k,d])=>{c.save();c.translate(d,-d/2);ring(c,k,4);c.restore()});c.globalCompositeOperation='source-over'},
radiance:(c,t)=>{ring(c,'#fc4',3);for(let i=0;i<24;i++){const a=i*TAU/24+t*.5,l=8+8*S(t*3+i*2);c.strokeStyle='#fd6';c.lineWidth=2;c.beginPath();c.moveTo(X+C(a)*64,Y+S(a)*64);c.lineTo(X+C(a)*(64+l),Y+S(a)*(64+l));c.stroke()}},
twilight:(c,t)=>{ring(c,cg(c,t,['#60f','#f6a','#fa4','#f6a','#60f']),7);for(let i=0;i<8;i++){const a=i*.8+t*.3;st4(c,X+C(a)*74,Y+S(a)*74,3+2*S(t*4+i),'#fff')}},
frosted:(c,t)=>{ring(c,'#cef',6);c.strokeStyle='#eff';c.lineWidth=1.5;for(let i=0;i<14;i++){const a=i*TAU/14,l=6+5*(i%3);c.beginPath();c.moveTo(X+C(a)*63,Y+S(a)*63);c.lineTo(X+C(a)*(63+l),Y+S(a)*(63+l));c.stroke()}if(R()<.4)st4(c,X+(R()-.5)*150,Y+(R()-.5)*150,3,'#fff')},
starlight:(c,t)=>{ring(c,'#335',2);for(let i=0;i<6;i++){const a=i*TAU/6+t;st4(c,X+C(a)*62,Y+S(a)*62,7+3*S(t*5+i),'#ffe9a0')}},
eclipse:(c,t)=>{c.shadowColor='#fa3';c.shadowBlur=18;ring(c,'#fa3',5);c.shadowBlur=0;c.fillStyle='#000';c.beginPath();c.arc(X+C(t)*60,Y+S(t)*60,16,0,TAU);c.fill()},
mirage:(c,t)=>{for(let k=0;k<3;k++){c.strokeStyle=`hsla(${180+k*40},90%,65%,.6)`;c.lineWidth=3;c.beginPath();for(let a=0;a<=TAU+.1;a+=.05){const r=60+k*3+4*S(a*7+t*3+k*2);c.lineTo(X+C(a)*r,Y+S(a)*r)}c.stroke()}}};
/* cursor */
const em=(s,x,y,n,v,l,col,g)=>{s.p||=[];for(let i=0;i<n;i++){const a=R()*TAU,q=R()*v;s.p.push({x,y,vx:C(a)*q,vy:S(a)*q+(g?0:0),l,L:l,col:col()})}};
const run=(c,s,g,d)=>{s.p=(s.p||[]).filter(p=>p.l>0);s.p.forEach(p=>{p.l--;g(p);p.x+=p.vx;p.y+=p.vy;d(c,p,p.l/p.L)})};
